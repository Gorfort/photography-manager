name: Backend Tests (Photography Manager)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/photography-manager-test
      JWT_SECRET: test_secret_key
      PORT: 5001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photography-manager/backend/package-lock.json

      - name: Install dependencies
        working-directory: photography-manager/backend
        run: npm ci

      - name: Run tests
        working-directory: photography-manager/backend
        run: npm test

      - name: Upload test results (optional future upgrade)
        if: always()
        run: echo "Tests completed"
