name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "photography-manager/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: photography-manager/frontend/package-lock.json

      - name: Install dependencies
        working-directory: photography-manager/frontend
        run: npm ci

      - name: Build
        working-directory: photography-manager/frontend
        env:
          # URL of the deployed backend API (set as a repository variable once the backend is hosted)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: photography-manager/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
